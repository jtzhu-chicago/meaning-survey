<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Attitudes Survey</title>
<style>
  :root{
    --bg:#FAF8F4;
    --ink:#23261F;
    --ink-soft:#55564E;
    --line:#DAD5C8;
    --accent:#3E5C52;
    --accent-soft:#E4EDE9;
    --warn:#A6432C;
    --card-bg:#FFFFFF;
    --max-w:640px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body.lang-zh{
    font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
    line-height:1.75;
  }
  .chrome{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  body.lang-zh .chrome{
    font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
  }
  #progress-wrap{
    position:fixed; top:0; left:0; right:0; height:4px;
    background:var(--line); z-index:50;
  }
  #progress-bar{
    height:100%; width:0%; background:var(--accent);
    transition:width .4s ease;
  }
  .screen-outer{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px 72px;
  }
  .screen{
    width:100%;
    max-width:var(--max-w);
    display:none;
  }
  .screen.active{display:block;}
  .eyebrow{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:10px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .qnum{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:16px;
    padding-bottom:10px;
    border-bottom:2px solid var(--accent);
  }
  h1{ font-size:26px; font-weight:400; line-height:1.3; margin:0 0 18px; }
  h2{ font-size:21px; font-weight:400; line-height:1.35; margin:0 0 20px; }
  p{margin:0 0 16px;}
  p.lede{color:var(--ink); font-size:17px;}
  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 24px;
    margin-bottom:18px;
  }
  .card h3{
    font-size:16px; font-weight:700;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    margin:0 0 8px; color:var(--accent);
  }
  .card p{font-size:16px; margin-bottom:0;}
  .statement-line{
    font-size:18px; line-height:1.5; margin:0 0 14px;
    padding:16px 18px; background:var(--card-bg); border:1px solid var(--line);
    border-radius:4px;
  }
  .statement-line strong{ color:var(--accent); }
  .slider-block{margin:28px 0 8px;}
  .slider-labels{
    display:flex; justify-content:space-between;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.4; color:var(--ink); margin-bottom:12px;
  }
  .slider-labels span{max-width:45%;}
  .slider-labels span:last-child{text-align:right;}
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none;
    height:6px; border-radius:3px; background:var(--line);
    outline:none; touch-action:pan-x;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--accent); border:3px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer; margin-top:0;
  }
  input[type=range]::-moz-range-thumb{
    width:26px; height:26px; border-radius:50%;
    background:var(--accent); border:3px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer;
  }
  input[type=range].untouched::-webkit-slider-thumb{ background:#fff; border:3px solid var(--accent); }
  input[type=range].untouched::-moz-range-thumb{ background:#fff; border:3px solid var(--accent); }

  .choice-list{list-style:none; margin:0 0 8px; padding:0;}
  .choice-item{
    border:1px solid var(--line); border-radius:4px; padding:14px 16px;
    margin-bottom:10px; cursor:pointer; font-size:16px; background:#fff;
    transition:border-color .15s, background .15s;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .choice-item:hover{border-color:var(--accent);}
  .choice-item:focus-visible, .rank-item:focus-visible{
    outline:3px solid var(--accent); outline-offset:1px;
  }
  .choice-item.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .rank-list{list-style:none; margin:0 0 8px; padding:0;}
  .rank-item{
    border:1px solid var(--line); border-radius:4px; padding:14px 16px;
    margin-bottom:10px; background:#fff; font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; gap:14px; user-select:none;
  }
  .rank-badge{
    flex:0 0 28px; height:28px; border-radius:50%;
    background:#fff; border:2px solid var(--accent); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .rank-item.ranked .rank-badge{ background:var(--accent); color:#fff; }
  textarea, input[type=text], input[type=number]{
    width:100%;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:16px; padding:12px 14px; border:1px solid var(--line);
    border-radius:4px; background:#fff; color:var(--ink);
  }
  textarea:focus, input:focus, input[type=range]:focus{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-row{margin-top:30px; display:flex; justify-content:flex-end; gap:12px;}
  button.next{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--accent); color:#fff; border:none; padding:13px 28px;
    border-radius:4px; font-size:15px; cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  button.next:disabled{opacity:.35; cursor:not-allowed;}
  button.next:not(:disabled):active{transform:translateY(1px);}
  .hint{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13px; color:var(--warn); margin-top:10px; min-height:18px;
  }
  .consent-box{
    background:var(--card-bg); border:1px solid var(--line); border-radius:4px;
    padding:26px 28px;
  }
  .code-box{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:4px;
    padding:18px 20px; font-size:20px; letter-spacing:.06em; text-align:center;
    margin:20px 0; color:var(--accent); font-weight:700;
  }
  a.download-link{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px; color:var(--accent); text-decoration:underline;
    margin-top:6px; cursor:pointer;
  }
  footer.note{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13px; color:var(--ink); margin-top:10px;
  }
</style>
</head>

<div id="progress-wrap"><div id="progress-bar"></div></div>

function rand(){ return Math.random(); }

function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<8;i++) s+=chars[Math.floor(rand()*chars.length)];
  return s;
}

/* ======================================================================
   FLOW ENGINE (with per-screen id for timing, and page-time logging)
   ====================================================================== */
let current = 0;
let FLOW = [];
let screenEnteredAt = Date.now();
const screensEl = document.getElementById('screens');
const progressBar = document.getElementById('progress-bar');

function leaveScreen(){
  const elapsed = Date.now() - screenEnteredAt;
  const id = (FLOW[current] && FLOW[current].id) || ('screen_'+current);
  DATA.timing[id+'_ms'] = elapsed;
}
function render(){
  const step = FLOW[current];
  const totalQuestions = FLOW.length - 1;
  const qnumHtml = current > 0
    ? '<div class="qnum chrome">'+S.qnum(current, totalQuestions)+'</div>'
    : '';
  screensEl.innerHTML = '<div class="screen active" id="s-'+current+'">'+qnumHtml+step.html()+'</div>';
  progressBar.style.width = (100*current/(FLOW.length-1))+'%';
  screenEnteredAt = Date.now();
  step.attach(document.getElementById('s-'+current));
  window.scrollTo(0,0);
}
function goNext(){
  leaveScreen();
  if(FLOW[current] && FLOW[current].checkpoint){
    DATA.meta.last_checkpoint = FLOW[current].id;
    submitCheckpoint();
  }
  if(current < FLOW.length-1){ current++; render(); }
}
function nextBtn(label){
  label = label || S.nav_continue;
  return '<div class="btn-row"><button class="next" id="nextBtn" disabled>'+label+'</button></div><div class="hint" id="hint"></div>';
}
function enableNext(msg){
  const b=document.getElementById('nextBtn');
  if(b){ b.disabled=false; }
  const h=document.getElementById('hint');
  if(h){ h.textContent = msg||''; }
}
function escAttr(str){ return String(str).replace(/"/g,'&quot;'); }
function sliderBlock(id, leftLabel, rightLabel){
  const aria = escAttr(leftLabel+' to '+rightLabel);
  return '<div class="slider-block">'+
    '<div class="slider-labels"><span>'+leftLabel+'</span><span>'+rightLabel+'</span></div>'+
    '<input type="range" min="0" max="100" value="50" step="1" id="'+id+'" class="untouched" aria-label="'+aria+'">'+
    '</div>';
}
// For sliders whose two ends are full sentences rather than short labels:
// show the sentences as normal-size text first, then a slider below with
// just short "A"/"B" end-nodes, instead of cramming long sentences into
// the small slider-label row.
function statementSliderBlock(id, textA, textB){
  const aria = escAttr(S.label_a+': '+textA+' — '+S.label_b+': '+textB);
  return '<p class="statement-line"><strong>'+S.label_a+'</strong> — '+textA+'</p>'+
    '<p class="statement-line"><strong>'+S.label_b+'</strong> — '+textB+'</p>'+
    '<div class="slider-block">'+
    '<div class="slider-labels"><span>'+S.label_a+'</span><span>'+S.label_b+'</span></div>'+
    '<input type="range" min="0" max="100" value="50" step="1" id="'+id+'" class="untouched" aria-label="'+aria+'">'+
    '</div>';
}
function wireSlider(id, onValid){
  const el = document.getElementById(id);
  el.addEventListener('input', function(){
    el.classList.remove('untouched');
    const v = parseInt(el.value,10);
    if(v === 50){ enableNext(S.slider_midpoint); }
    else { onValid(v); enableNext(''); }
  });
}
function wireSingleChoice(listId, options, onPick){
  const list = document.getElementById(listId);
  list.querySelectorAll('.choice-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      list.querySelectorAll('.choice-item').forEach(i=>i.classList.remove('selected'));
      item.classList.add('selected');
      onPick(item.dataset.value);
    });
  });
}

      ${RANK_ORDER.map(it=>`<li class="rank-item" tabindex="0" role="button" data-key="${it[0]}"><span class="rank-badge">–</span><span>${it[1]}</span></li>`).join('')}
    </ul>
    ${nextBtn()}
  `,
  attach:()=>{
    const list = document.getElementById('rankList');
    let order = [];
    function refresh(){
      list.querySelectorAll('.rank-item').forEach(li=>{
        const pos = order.indexOf(li.dataset.key);
        const badge = li.querySelector('.rank-badge');
        if(pos>-1){ badge.textContent=(pos+1); li.classList.add('ranked'); }
        else { badge.textContent='–'; li.classList.remove('ranked'); }
      });
      if(order.length===4){
        S.rank_items.forEach(it=>{ DATA.module2.rank[it[0]] = order.indexOf(it[0])+1; });
        DATA.module2.rank_presentation_order = RANK_ORDER.map(i=>i[0]).join('>');
        enableNext('');
      } else { enableNext(''); }
    }
    list.querySelectorAll('.rank-item').forEach(li=>{
      li.addEventListener('click', ()=>{
        const key = li.dataset.key;
        const pos = order.indexOf(key);
        if(pos>-1){ order.splice(pos,1); } else { order.push(key); }
        refresh();
      });
    });
    refresh();
    document.getElementById('nextBtn').addEventListener('click', goNext);
  }
});

function scenarioScreen(kind){
  const isEcon = kind==='economic';
  const intro = isEcon ? S.econ_intro : S.cult_intro;
  const structural = isEcon ? S.econ_structural : S.cult_structural;
  const eliteBlame = isEcon ? S.econ_elite : S.cult_elite;
  const aIsStructural = isEcon ? ECON_EXPL_A_IS_STRUCTURAL : CULT_EXPL_A_IS_STRUCTURAL;
  const explA = aIsStructural ? structural : eliteBlame;
  const explB = aIsStructural ? eliteBlame : structural;
  const idA = kind+'_explA', idB = kind+'_explB';
  return { id:'module4_'+kind, html:()=>`
      <div class="eyebrow chrome">${S.scenario_eyebrow}</div>
      <h2>${intro}</h2>
      <p>${S.scenario_prompt}</p>
      <div class="card"><h3>${S.expl_a}</h3><p>${explA}</p>${sliderBlock(idA, S.cred_low, S.cred_high)}</div>
      <div class="card"><h3>${S.expl_b}</h3><p>${explB}</p>${sliderBlock(idB, S.cred_low, S.cred_high)}</div>
      ${nextBtn()}
    `,
    attach:()=>{
      let ok1=false, ok2=false;
      wireSlider(idA, v=>{
        if(aIsStructural){ DATA.module4[kind+'_structural_credibility']=v; }
        else { DATA.module4[kind+'_elite_blame_credibility']=v; }
        ok1=true; if(ok1&&ok2) enableNext('');
      });
      wireSlider(idB, v=>{
        if(aIsStructural){ DATA.module4[kind+'_elite_blame_credibility']=v; }
        else { DATA.module4[kind+'_structural_credibility']=v; }
        ok2=true; if(ok1&&ok2) enableNext('');
      });
      document.getElementById('nextBtn').addEventListener('click', goNext);
    }
  };
}

/* ======================================================================
   SUBMISSION
   ====================================================================== */
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbx_SCIW5GtKB3aviC9-sjB_M3uzdnksv4YN20gy4YLinO-4igXtAKXFREZ4jUXyPQKo5A/exec";
// Prolific's completion code is fixed per study (not per-respondent) — this
// is the exact URL Prolific generated for you in the study setup page.
// Loading this URL is what tells Prolific the participant finished; there
// is no per-respondent code to generate on our side.
const PROLIFIC_COMPLETION_URL = "https://app.prolific.com/submissions/complete?cc=CNG4MBNT";
const PROLIFIC_COMPLETION_CODE = "CNG4MBNT";

function flattenData(){
  const flat = {};
  function walk(obj, prefix){
    Object.keys(obj).forEach(k=>{
      const val = obj[k];
      const key = prefix ? prefix+'.'+k : k;
      if(val && typeof val==='object' && !Array.isArray(val)){ walk(val, key); }
      else { flat[key] = val; }
    });
  }
  walk(DATA,'');
  return flat;
}

// Fire-and-forget partial submission at a few checkpoints along the way,
// so a respondent who drops out mid-survey still leaves usable data.
// The Apps Script upserts by meta.client_session_id, so each checkpoint
// (and the final submission) overwrite the same row rather than adding
// new ones.
function submitCheckpoint(){
  const payload = flattenData();
  fetch(GAS_ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(res=>console.log('Checkpoint ['+DATA.meta.last_checkpoint+'] submitted:', res.status))
    .catch(err=>console.warn('Checkpoint ['+DATA.meta.last_checkpoint+'] failed (non-blocking):', err));
}

function submitAndShowDebrief(){
  leaveScreen(); // log time spent on the final (happiness) screen
  // Prolific's completion code is fixed per study, not generated per
  // respondent — we just record which one was shown, for our own log.
  DATA.meta.completion_code = PROLIFIC_COMPLETION_CODE;
  DATA.meta.finished_at = new Date().toISOString();
  DATA.meta.is_complete = true;
  DATA.meta.last_checkpoint = 'happiness';
  const payload = flattenData();
  const downloadUrl = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)], {type:'application/json'}));

  let submitOk = true;
  const finish = ()=>{
    SURVEY_COMPLETE = true;
    screensEl.innerHTML = '<div class="screen active">'+debriefScreen(submitOk, downloadUrl, DATA.meta.client_session_id)+'</div>';
    progressBar.style.width = '100%';
    window.scrollTo(0,0);
  };

  console.log('Submitting to:', GAS_ENDPOINT);
  console.log('Payload:', payload);

  fetch(GAS_ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(res=>{
      console.log('Response status:', res.status, res.statusText);
      if(!res.ok){ submitOk=false; return res.text().then(t=>console.error('Body (not ok):', t)); }
      return res.json().then(j=>{
        console.log('Response body:', j);
        if(!j || j.status !== 'ok'){ submitOk=false; }
      }).catch(err=>{ console.error('Could not parse JSON response:', err); submitOk=false; });
    })
    .catch(err=>{ console.error('Fetch failed (network/CORS):', err); submitOk=false; })
    .finally(()=>{ finish(); });
}

/* ======================================================================
   ACCESSIBILITY: keyboard activation for clickable list items
   (.choice-item / .rank-item are plain <li> elements with role="button"
   and tabindex="0" so they're reachable by Tab; this makes Enter/Space
   activate them too, same as a native button would respond to.)
   ====================================================================== */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
  const el = document.activeElement;
  if(el && (el.classList.contains('choice-item') || el.classList.contains('rank-item'))){
    e.preventDefault();
    el.click();
  }
});

/* ======================================================================
   GUARD RAILS: browser back-button trap and accidental-close warning.
   Respondents should navigate only with the on-screen Continue button —
   going back with the browser's own back button would desync the app's
   internal state (current screen index, routing already computed) from
   whatever stale DOM the browser shows.
   ====================================================================== */
let SURVEY_COMPLETE = false;
history.pushState(null, '', location.href);
window.addEventListener('popstate', function(){
  history.pushState(null, '', location.href);
  if(!SURVEY_COMPLETE){
    alert(LANG === 'zh'
      ? '请不要使用浏览器的"后退"按钮——请使用页面上的"继续"按钮进行操作。'
      : 'Please don\u2019t use your browser\u2019s back button during this survey — use the Continue button on the page instead.');
  }
});
window.addEventListener('beforeunload', function(e){
  if(!SURVEY_COMPLETE){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ======================================================================
   INIT
   ====================================================================== */
render();
